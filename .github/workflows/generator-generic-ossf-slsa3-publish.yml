checkManifest reports a digest "does not match" even when the manifest does not contain a package SHA256 at all (e.g. manifest.package.digests.sha256 missing). That makes diagnostics misleading when the manifest is incomplete/corrupted; it should distinguish "missing" vs "mismatch".
