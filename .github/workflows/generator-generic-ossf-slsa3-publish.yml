readAllZipEntries buffers every file in the VSIX into memory at once. verify-signature already loads the full package into memory for the outer signature check, so this can effectively double peak memory for large extensions and become a reliability issue. Consider streaming each entry into a SHA256 hash (and tracking seen keys) instead of materializing all entry buffers in a Map.
